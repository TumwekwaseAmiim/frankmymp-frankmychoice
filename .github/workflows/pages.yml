
# =====================================================
# #FrankMyMP #FrankMyChoice
# Cloudflare Pages News Preview Build Checks
#
# Public hosting: Cloudflare Pages
# News database: Firebase Firestore
# Photographs: Cloudinary
# =====================================================

name: Verify Frank News Website

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frank-news-verification
  cancel-in-progress: true

jobs:
  verify:
    name: Verify website build

    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # CHECK OUT REPOSITORY
      # ==========================================

      - name: Checkout source code
        uses: actions/checkout@v4

      # ==========================================
      # NODE.JS
      # ==========================================

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # ==========================================
      # DEPENDENCIES
      # ==========================================

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # ==========================================
      # VERIFY JAVASCRIPT
      # ==========================================

      - name: Check news build script
        run: node --check tools/build.mjs

      - name: Check public interface scripts
        run: |
          node --check js/ui.js
          node --check js/home.js
          node --check js/post.js
          node --check js/config.js
          node --check js/install.js

      # ==========================================
      # CONFIRM WEBSITE FILES
      # ==========================================

      - name: Check essential website files
        run: |
          test -f index.html
          test -f post.html
          test -f manifest.webmanifest
          test -f css/style.css
          test -f js/home.js
          test -f js/post.js
          test -f tools/build.mjs

      # ==========================================
      # SUCCESS
      # ==========================================

      - name: Verification complete
        run: |
          echo "Frank News website checks completed."
          echo "Cloudflare Pages handles deployment."
